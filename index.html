<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- ===== SEO (app.js بيحدّث العنوان والوصف من config.js) ===== -->
  <title>حازم مصطفى | مهندس برمجيات</title>
  <meta name="description" content="">
  <meta name="author" content="Hazem Mostafa">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="">
  <meta property="og:type" content="website">
  <meta property="og:title" content="">
  <meta property="og:description" content="">
  <meta property="og:url" content="">
  <meta property="og:image" content="">
  <meta name="twitter:card" content="summary_large_image">
  <script type="application/ld+json" id="jsonld"></script>

  <!-- أيقونة التبويب -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23423C3C'/%3E%3Cpath d='M11 10l-5 6 5 6M21 10l5 6-5 6' stroke='%2310b981' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">

  <!-- الخطوط -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">

  <!-- يمنع وميض الوضع/اللغة قبل تحميل الصفحة -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme2");
        var l = localStorage.getItem("lang");
        var d = document.documentElement;
        if (t) d.setAttribute("data-theme", t);
        if (l) { d.lang = l; d.dir = l === "ar" ? "rtl" : "ltr"; }
      } catch (e) {}
    })();
  </script>
</head>

<body>
  <a class="skip-link" href="#main" data-i18n="skip">تخطّي إلى المحتوى</a>

  <!-- ================= الشريط العلوي ================= -->
  <header class="header" id="top">
    <div class="container header__inner">
      <a href="#home" class="brand" aria-label="Home">
        <span class="brand__name" data-bind="name">حازم مصطفى</span>
        <span class="brand__dot" id="brandDot" aria-hidden="true"></span>
      </a>

      <nav class="nav" id="nav" aria-label="Main">
        <a href="#home"     data-i18n="nav_home">الرئيسية</a>
        <a href="#skills"   data-i18n="nav_skills">المهارات</a>
        <a href="#projects" data-i18n="nav_projects">المشاريع</a>
        <a href="#contact"  data-i18n="nav_contact">تواصل معي</a>
      </nav>

      <div class="header__tools">
        <button class="btn-icon" id="themeBtn" type="button" aria-label="Toggle theme" title="Theme">
          <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        </button>
        <button class="btn-chip" id="langBtn" type="button" aria-label="Switch language">EN</button>
        <button class="btn-icon menu-btn" id="menuBtn" type="button" aria-label="Menu" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main id="main">

    <!-- ================= الرئيسية ================= -->
    <section class="hero" id="home">
      <div class="container hero__inner">
        <div class="hero__text">
          <span class="tag" data-bind="title">مهندس برمجيات متكامل</span>
          <h1 class="hero__name" data-bind="name">حازم مصطفى</h1>
          <p class="hero__bio" data-bind="bio"></p>

          <div class="hero__cta">
            <a class="btn btn--primary" id="ctaContact" href="#contact" data-i18n="cta_contact">تواصل معي مباشرة</a>
            <a class="btn btn--ghost" href="#projects" data-i18n="cta_projects">استعراض المشاريع</a>
          </div>
        </div>

        <div class="hero__side">
          <div class="photo" id="photo" aria-hidden="false"></div>

          <div class="status" id="status" data-state="available">
            <div class="status__row">
              <span class="status__dot" aria-hidden="true"></span>
              <span class="status__text" id="statusText"></span>
            </div>
            <div class="countdown" id="statusCountdown" hidden>
              <span class="countdown__label" id="statusCountdownLabel"></span>
              <span class="countdown__time" id="statusCountdownTime" dir="ltr"></span>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- ================= المهارات ================= -->
    <section class="section" id="skills">
      <div class="container">
        <header class="section__head">
          <h2 data-i18n="skills_title">المهارات والتقنيات</h2>
          <p data-i18n="skills_sub">الأدوات واللغات اللي بشتغل بيها.</p>
        </header>
        <div class="skills-grid" id="skillsGrid"></div>
      </div>
    </section>

    <!-- ================= المشاريع ================= -->
    <section class="section" id="projects">
      <div class="container">
        <header class="section__head">
          <h2 data-i18n="projects_title">المشاريع والأعمال</h2>
          <p data-i18n="projects_sub">نماذج من اللي اشتغلت عليه.</p>
        </header>
        <div class="projects-grid" id="projectsGrid"></div>
        <p class="empty" id="projectsEmpty" hidden data-i18n="projects_empty">المشاريع هتتضاف قريباً.</p>
      </div>
    </section>

    <!-- ================= التواصل ================= -->
    <section class="section" id="contact">
      <div class="container">
        <header class="section__head">
          <h2 data-i18n="contact_title">تواصل معي</h2>
          <p class="contact-status"><span class="status__dot status__dot--on" aria-hidden="true"></span><span id="contactStatusText"></span></p>
        </header>

        <div class="contact">
          <div class="contact__links" id="contactLinks"></div>

          <form class="form" id="contactForm" novalidate>
            <label>
              <span data-i18n="f_name">الاسم</span>
              <input type="text" name="name" required autocomplete="name">
            </label>
            <label>
              <span data-i18n="f_email">البريد الإلكتروني</span>
              <input type="email" name="email" required autocomplete="email" dir="ltr">
            </label>
            <label>
              <span data-i18n="f_message">الرسالة</span>
              <textarea name="message" rows="5" required></textarea>
            </label>
            <button class="btn btn--primary" type="submit" data-i18n="f_send">إرسال</button>
            <p class="form__msg" id="formMsg" role="status" aria-live="polite"></p>
          </form>
        </div>
      </div>
    </section>

  </main>

  <!-- ================= الفوتر ================= -->
  <footer class="footer">
    <div class="container footer__inner">
      <span>© <span id="year"></span> <span data-bind="name">حازم مصطفى</span></span>
      <a href="#top" data-i18n="back_top">للأعلى ↑</a>
    </div>
  </footer>

  <!-- الترتيب مهم: config.js الأول -->
  <script src="config.js"></script>
  <script src="app.js" defer></script>
</body>
</html>
