<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة التحكم</title>
<style>
:root{--bg:#423C3C;--s:#4C4545;--s2:#383232;--b:rgba(255,255,255,.14);--t:#F4F0EB;--m:#CFC7BF;--a:#10b981}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font:16px/1.6 system-ui,"Segoe UI",Tahoma,sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 20px;background:var(--s2);border-bottom:1px solid var(--b)}
header h1{font-size:1.1rem;margin:0;flex:1}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--b);background:var(--s);color:var(--t);padding:8px 14px}
button.p{background:var(--a);color:#06251a;border-color:var(--a);font-weight:700}
button.d{color:#f87171;justify-self:start}
#tabs{display:flex;gap:8px;padding:14px 20px;overflow-x:auto;max-width:860px;margin:0 auto}
#tabs button.on{border-color:var(--a);color:#34d399}
main{max-width:860px;margin:0 auto;padding:0 20px 60px}
section{display:none;gap:14px}section.on{display:grid}
.card{background:var(--s);border:1px solid var(--b);border-radius:14px;padding:18px;display:grid;gap:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
label{display:grid;gap:4px;font-size:.9rem;color:var(--m)}
input,textarea,select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--b);background:var(--s2);color:var(--t);font:inherit}
textarea{min-height:80px}
img.pv{width:120px;height:120px;object-fit:cover;border-radius:12px;border:2px solid var(--a);background:var(--s2)}
#msg{font-size:.9rem}
@media(max-width:600px){.row{grid-template-columns:1fr}}
</style></head><body>
<header><h1>لوحة التحكم</h1><span id="msg"></span><button class="p" id="save">💾 حفظ</button></header>
<div id="tabs"><button class="on" data-t="profile">بياناتي</button><button data-t="status">الحالة</button><button data-t="contact">التواصل</button><button data-t="projects">المشاريع</button></div>
<main>
<section id="t-profile" class="on">
  <div class="card"><b>صورتك</b><img class="pv" id="photoPv" alt=""><input type="file" id="photoFile" accept="image/*"></div>
  <div class="card">
    <div class="row"><label>الاسم (عربي)<input data-k="profile.name.ar"></label><label>Name (EN)<input dir="ltr" data-k="profile.name.en"></label></div>
    <div class="row"><label>المسمى (عربي)<input data-k="profile.title.ar"></label><label>Title (EN)<input dir="ltr" data-k="profile.title.en"></label></div>
    <div class="row"><label>نبذة (عربي)<textarea data-k="profile.bio.ar"></textarea></label><label>Bio (EN)<textarea dir="ltr" data-k="profile.bio.en"></textarea></label></div>
  </div>
  <div class="card"><b>الموقع و SEO</b>
    <label>الدومين<input dir="ltr" data-k="site.domain" placeholder="https://example.com"></label>
    <div class="row"><label>وصف الموقع (عربي)<textarea data-k="site.description.ar"></textarea></label><label>Description (EN)<textarea dir="ltr" data-k="site.description.en"></textarea></label></div>
  </div>
</section>
<section id="t-status"><div class="card">
  <label>حالتك<select id="state"><option value="available">متاح للتطوير الآن</option><option value="busy">غير متاح حالياً</option></select></label>
  <div id="busyBox" style="display:none;gap:12px">
    <div class="row"><label>بعد كام؟<input type="number" id="hrs" min="1" value="24"></label><label>الوحدة<select id="unit"><option value="1">ساعة</option><option value="24">يوم</option></select></label></div>
    <button id="apply">احسب موعد رجوعك</button>
    <label>هكون متاح في<input type="datetime-local" id="again"></label>
  </div>
  <small style="color:var(--m)">"متاح للتواصل والاستفسارات" بتفضل شغالة دايماً من غير عداد.</small>
</div></section>
<section id="t-contact"><div class="card">
  <label>رقم الواتساب (بالصيغة الدولية، أرقام بس)<input dir="ltr" id="wa" placeholder="20xxxxxxxxxx"></label>
  <label>البريد الإلكتروني<input dir="ltr" id="em" placeholder="you@example.com"></label>
  <label>GitHub (رابط كامل)<input dir="ltr" id="gh"></label>
  <label>LinkedIn (رابط كامل)<input dir="ltr" id="li"></label>
  <small style="color:var(--m)">أي خانة فاضية الزرار بتاعها بيختفي من الموقع.</small>
</div></section>
<section id="t-projects"><button class="p" id="addP">+ مشروع جديد</button><div id="plist" style="display:grid;gap:14px"></div></section>
</main>
<script>
let D;const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const get=(o,p)=>p.split('.').reduce((a,k)=>a&&a[k],o);
const set=(o,p,v)=>{const a=p.split('.'),l=a.pop();a.reduce((x,k)=>x[k],o)[l]=v};
const toLocal=i=>{const d=new Date(i);return i&&!isNaN(d)?new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,16):''};
const fromLocal=v=>v?new Date(v).toISOString():'';
const say=(t,bad)=>{$('#msg').textContent=t;$('#msg').style.color=bad?'#f87171':'#34d399'};
async function upload(file,kind){const f=new FormData();f.append('file',file);const r=await fetch('/api/upload?kind='+kind,{method:'POST',body:f});const j=await r.json();if(!r.ok)throw new Error(j.error||'فشل الرفع');return j.path}
const NEWP=()=>({title:{ar:'',en:''},description:{ar:'',en:''},image:'',tech:[],status:'in-progress',finishAt:'',links:{live:'',repo:''}});

async function init(){
  D=await (await fetch('/api/data')).json();
  document.querySelectorAll('[data-k]').forEach(e=>e.value=get(D,e.dataset.k)||'');
  $('#photoPv').src=D.profile.photo?'/'+D.profile.photo:'';
  $('#state').value=D.status.state;$('#again').value=toLocal(D.status.availableAgainAt);showBusy();
  $('#wa').value=(D.links.whatsapp||'').replace(/\D/g,'');$('#em').value=(D.links.email||'').replace(/^mailto:/i,'');
  $('#gh').value=D.links.github||'';$('#li').value=D.links.linkedin||'';
  drawP();
}
function showBusy(){$('#busyBox').style.display=D.status.state==='busy'?'grid':'none'}
document.addEventListener('input',e=>{const k=e.target.dataset.k;if(k)set(D,k,e.target.value)});
$('#state').onchange=e=>{D.status.state=e.target.value;showBusy()};
$('#again').oninput=e=>{D.status.availableAgainAt=fromLocal(e.target.value)};
$('#apply').onclick=()=>{const t=new Date(Date.now()+(+$('#hrs').value||0)*(+$('#unit').value)*36e5);$('#again').value=toLocal(t);D.status.availableAgainAt=t.toISOString()};
$('#photoFile').onchange=async e=>{try{const p=await upload(e.target.files[0],'photo');D.profile.photo=p;$('#photoPv').src='/'+p;say('اترفعت الصورة، دوس حفظ')}catch(x){say(x.message,1)}};

document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#tabs button,section').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');$('#t-'+b.dataset.t).classList.add('on')});

function drawP(){
  $('#plist').innerHTML=D.projects.map((p,i)=>`<div class="card" data-i="${i}">
  <div style="display:flex;gap:12px;align-items:center"><img class="pv" src="${p.image?'/'+esc(p.image):''}" alt=""><input type="file" accept="image/*" data-f="_img"></div>
  <div class="row"><label>الاسم (عربي)<input data-f="title.ar" value="${esc(p.title.ar)}"></label><label>Title (EN)<input dir="ltr" data-f="title.en" value="${esc(p.title.en)}"></label></div>
  <div class="row"><label>الوصف (عربي)<textarea data-f="description.ar">${esc(p.description.ar)}</textarea></label><label>Description (EN)<textarea dir="ltr" data-f="description.en">${esc(p.description.en)}</textarea></label></div>
  <label>التقنيات (افصل بفاصلة)<input dir="ltr" data-f="tech" value="${esc((p.tech||[]).join(', '))}" placeholder="Python, Next.js"></label>
  <div class="row"><label>الحالة<select data-f="status"><option value="done"${p.status==='done'?' selected':''}>منتهي</option><option value="in-progress"${p.status!=='done'?' selected':''}>قيد التنفيذ</option></select></label>
  <label style="${p.status==='done'?'display:none':''}">ينتهي في (عداد)<input type="datetime-local" data-f="finishAt" value="${toLocal(p.finishAt)}"></label></div>
  <div class="row"><label>رابط المعاينة<input dir="ltr" data-f="links.live" value="${esc(p.links.live)}"></label><label>رابط الكود<input dir="ltr" data-f="links.repo" value="${esc(p.links.repo)}"></label></div>
  <button class="d" data-del>حذف المشروع</button></div>`).join('')||'<div class="card">مفيش مشاريع لسه.</div>';
}
$('#plist').addEventListener('input',e=>{
  const f=e.target.dataset.f;if(!f||f==='_img'||f==='status')return;
  const p=D.projects[e.target.closest('[data-i]').dataset.i];let v=e.target.value;
  if(f==='tech')v=v.split(',').map(s=>s.trim()).filter(Boolean);
  if(f==='finishAt')v=fromLocal(v);
  set(p,f,v)});
$('#plist').addEventListener('change',async e=>{
  const f=e.target.dataset.f;if(!f)return;
  const p=D.projects[e.target.closest('[data-i]').dataset.i];
  if(f==='status'){p.status=e.target.value;drawP()}
  if(f==='_img'&&e.target.files[0]){try{p.image=await upload(e.target.files[0],'project');drawP();say('اترفعت الصورة، دوس حفظ')}catch(x){say(x.message,1)}}});
$('#plist').addEventListener('click',e=>{
  if(e.target.dataset.del!==undefined&&confirm('تحذف المشروع؟')){D.projects.splice(e.target.closest('[data-i]').dataset.i,1);drawP()}});
$('#addP').onclick=()=>{D.projects.push(NEWP());drawP()};

$('#save').onclick=async()=>{
  const w=$('#wa').value.replace(/\D/g,'');D.links.whatsapp=w?'https://wa.me/'+w:'';
  const m=$('#em').value.trim();D.links.email=m?'mailto:'+m:'';
  D.links.github=$('#gh').value.trim();D.links.linkedin=$('#li').value.trim();
  try{const r=await fetch('/api/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(D)});if(!r.ok)throw 0;say('تم الحفظ ✓ افتح الموقع واعمل Refresh')}catch(x){say('فشل الحفظ',1)}};
init();
</script></body></html>
